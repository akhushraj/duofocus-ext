<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Focus Time!</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap');

        body {
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }

        .container {
            max-width: 500px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fbbf24 0%, #f87171 50%, #ef4444 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: -0.02em;
            text-shadow: 0 0 40px rgba(251, 191, 36, 0.3);
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }

        p {
            font-size: 1.2rem;
            color: var(--text-primary);
            margin: 0;
            line-height: 1.6;
            max-width: 600px;
            white-space: nowrap;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            font-weight: 500;
        }

        img.mascot {
            width: 200px;
            height: auto;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 30px rgba(99, 102, 241, 0.3));
            background: transparent;
            display: block;
        }

        @keyframes float {
            0% {
                transform: translateY(0px) scale(1);
            }

            50% {
                transform: translateY(-10px) scale(1.02);
            }

            100% {
                transform: translateY(0px) scale(1);
            }
        }

        .mode-badge {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.2) 0%, rgba(139, 92, 246, 0.2) 100%);
            color: #a78bfa;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-weight: 700;
            font-size: 1.2rem;
            display: inline-block;
            border: 2px solid rgba(167, 139, 250, 0.3);
            box-shadow: 0 4px 16px rgba(99, 102, 241, 0.2);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
        }

        .mode-container {
            margin: 0.5rem 0;
            font-size: 1.2rem;
            color: var(--text-primary);
            font-family: 'Fredoka', 'Comic Sans MS', cursive, sans-serif;
            font-weight: 500;
            white-space: nowrap;
            max-width: 600px;
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="/icons/mascot.png" alt="Focus Owl" class="mascot">
        <h1>Focus Time!</h1>

        <p>Why are you visiting blocked sites? Get back to work!</p>
        <p style="font-size:0.6rem; opacity:0.3;">v4</p>

        <p>Uh oh! This site is taking a nap right now. You are currently in <span class="mode-badge" id="modeName">Loading...</span> mode.</p>

        <!-- Only shown when a redirect chain caused the block -->
        <div id="redirectNotice" style="display:none; margin-top: 1rem; padding: 0.85rem 1.25rem; background: rgba(251,191,36,0.12); border: 1.5px solid rgba(251,191,36,0.4); border-radius: 12px; max-width: 440px; text-align: left;">
            <p style="font-size: 0.95rem; white-space: normal; margin-bottom: 0.4rem; color: var(--text-primary);">
                🔗 You were trying to reach <strong id="intendedDomain" style="color:#fbbf24;"></strong>, but it redirected through <strong id="blockedDomain" style="color:#f87171;"></strong> which isn't in the allowlist.
            </p>
            <p style="font-size: 0.85rem; white-space: normal; margin: 0; color: var(--text-secondary);">
                Ask a parent to add <strong id="blockedDomainRepeat"></strong> to the allowlist to fix this.
            </p>
        </div>
    </div>

    <script src="utils.js"></script>
    <script>
        function getDomain(url) {
            try { return new URL(url).hostname.replace('www.', ''); } catch (e) { return url; }
        }

        // ── Mode badge ────────────────────────────────────────────────────────
        // Computed synchronously from the current time — zero storage dependency,
        // never shows "Loading...". We then try to refine it with the real config.
        (function showModeBadge() {
            const el = document.getElementById('modeName');
            if (!el) return;

            function calcMode(schedule) {
                const mins = new Date().getHours() * 60 + new Date().getMinutes();
                const times = Object.keys(schedule).sort();
                if (!times.length) return 'free';
                let active = times[times.length - 1]; // wrap-around default
                for (const t of times) {
                    const [h, m] = t.split(':').map(Number);
                    if (mins >= h * 60 + m) active = t; else break;
                }
                return schedule[active] || 'free';
            }

            const defaultSchedule = {"07:00":"free","15:00":"study","18:00":"free","20:00":"sleep"};
            const quickMode = calcMode(defaultSchedule);
            el.textContent = quickMode.charAt(0).toUpperCase() + quickMode.slice(1);

            // Refine with actual user config asynchronously
            chrome.storage.local.get(['config']).then(data => {
                if (!data.config?.schedule) return;
                const mode = calcMode(data.config.schedule);
                el.textContent = mode.charAt(0).toUpperCase() + mode.slice(1);
            }).catch(() => {});
        })();

        // ── Nav tracking & auto-navigate ──────────────────────────────────────
        (async function() {
            let intendedUrl = null;
            let blockedUrl  = null;

            // 1. Hash survives a refresh — try it first
            const hash = window.location.hash;
            if (hash && hash.length > 1) {
                try { intendedUrl = decodeURIComponent(hash.slice(1)); } catch (e) {}
            }

            // 2. Ask the service worker directly (in memory, no storage race condition)
            if (!intendedUrl) {
                try {
                    const nav = await chrome.runtime.sendMessage({ type: 'getBlockedNav' });
                    if (nav) { intendedUrl = nav.intendedUrl; blockedUrl = nav.blockedUrl; }
                } catch (e) {}
            }

            // 3. Fall back to local storage (backup, may be slightly stale)
            if (!intendedUrl) {
                try {
                    const tabs = await chrome.tabs.query({ active: true, currentWindow: true });
                    if (tabs?.length) {
                        const key = `blockedNav_${tabs[0].id}`;
                        const data = await chrome.storage.local.get([key]);
                        const nav  = data[key];
                        if (nav && Date.now() - (nav.ts || 0) < 5 * 60 * 1000) {
                            intendedUrl = nav.intendedUrl;
                            blockedUrl  = nav.blockedUrl;
                        }
                    }
                } catch (e) {}
            }

            // Persist in hash so refresh retries the right URL
            if (intendedUrl) {
                history.replaceState(null, '', `${window.location.pathname}#${encodeURIComponent(intendedUrl)}`);
            }

            // Register storage-change listener unconditionally so toggling master
            // off always triggers navigation even when intendedUrl is unknown
            chrome.storage.onChanged.addListener(async (changes, area) => {
                if (area !== 'local') return;
                if (changes.config || changes.currentMode) {
                    const target = intendedUrl;
                    if (target && !(await wouldBeBlocked(target))) {
                        window.location.href = target;
                    } else if (!target && changes.config?.newValue?.masterEnabled === false) {
                        history.back(); // No URL? At least go back.
                    }
                }
            });

            if (!intendedUrl) return;

            // If the block was already removed before this page loaded, navigate now
            if (!(await wouldBeBlocked(intendedUrl))) {
                window.location.href = intendedUrl;
                return;
            }

            // Show redirect-chain notice only when domains differ
            if (blockedUrl) {
                const iDomain = getDomain(intendedUrl);
                const bDomain = getDomain(blockedUrl);
                if (iDomain && bDomain && iDomain !== bDomain) {
                    document.getElementById('intendedDomain').textContent      = iDomain;
                    document.getElementById('blockedDomain').textContent       = bDomain;
                    document.getElementById('blockedDomainRepeat').textContent = bDomain;
                    document.getElementById('redirectNotice').style.display    = 'block';
                }
            }
        })();
    </script>
</body>

</html>
